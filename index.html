#sheet{position:absolute;left:10px;right:10px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:480px;padding:12px;display:none}

@media (max-width:899px){#top{max-width:none}#top .search{padding:11px 14px}#top .search input{font-size:14px}#bar{padding:0 2px}#fab{right:12px;top:auto;bottom:calc(78px + env(safe-area-inset-bottom,0px))}#demoBadge{font-size:8.5px;bottom:calc(7px + env(safe-area-inset-bottom,0px));padding:4px 8px}}
/* Splash */
#splash{z-index:20;overflow:hidden;background:#030208;transition:opacity .95s ease,visibility .95s ease}
#splashArt{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}#splashArt picture,#splashArt img{display:block;width:100%;height:100%}#splashArt img{object-fit:cover;object-position:center;transform:scale(1);filter:brightness(.92) saturate(1.03);transition:transform 1.45s cubic-bezier(.22,.61,.36,1),filter 1s ease;will-change:transform,filter}
#splashArt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 18% 52%,rgba(3,2,8,.72),rgba(3,2,8,.48) 31%,transparent 62%),linear-gradient(90deg,rgba(3,2,8,.38),transparent 52%),linear-gradient(180deg,rgba(3,2,8,.08),transparent 48%,rgba(3,2,8,.34));pointer-events:none}

#bot{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px;margin-top:22px}#bot .search{text-align:left;background:rgba(20,18,32,.55);border:1px solid #ffffff38;box-shadow:inset 0 -1px 0 #ff3ec880;padding:14px 18px;color:#cfc8dc}#bot .search span{font-size:14px;color:#b9b1c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bot .cta{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;background:linear-gradient(90deg,#ff5fc6,#ff2fb7);padding:16px;box-shadow:0 0 26px #ff3ec84d;transition:transform .25s,box-shadow .25s,filter .25s}#bot .cta:active{transform:scale(.97);filter:brightness(.95)}

function isMobileMap(){
 return matchMedia("(max-width:899px), (orientation:portrait)").matches;
}
function mapViewportPadding(){
 // A visão geral deve priorizar enxergar Leonida inteira. A UI fica sobre o mapa,
 // então não reservamos uma faixa enorme à esquerda no desktop.
 if(isMobileMap()) return {top:132,bottom:54,left:16,right:16};
 return {top:24,bottom:24,left:26,right:26};
}
function fitWholeMap(duration=0){
 if(!BaseMap.map)return;
 const m=BaseMap.map;
 // v6.2: calcula a câmera diretamente com o tamanho REAL do canvas já visível.
 // Isso evita o enquadramento apertado que o fitBounds estava produzindo no desktop.
 m.resize();
 const cam=m.cameraForBounds(CONFIG.mapBounds,{padding:isMobileMap()?18:8,maxZoom:4.2});
 if(!cam)return;
 const extraOut=isMobileMap()?0.38:1.30;
 const targetZoom=Math.max(m.getMinZoom(),cam.zoom-extraOut);
 m.easeTo({center:cam.center,zoom:targetZoom,pitch:0,bearing:0,duration,essential:true});
}

function applyMapTheme(name){
 mapTheme=name;
 const t=MAP_THEMES[name]||MAP_THEMES.standard;
 const m=BaseMap.map;if(!m)return;
 if(m.getLayer("bg"))m.setPaintProperty("bg","background-color",t.water);
 if(m.getLayer("land-fill"))m.setPaintProperty("land-fill","fill-color",t.land);
 if(m.getLayer("land-outline"))m.setPaintProperty("land-outline","line-color",t.landOutline);
 if(m.getLayer("roads-major"))m.setPaintProperty("roads-major","line-color",t.road);
 if(m.getLayer("roads-minor"))m.setPaintProperty("roads-minor","line-color",t.roadMinor);
 document.querySelectorAll("#stylePanel [data-style]").forEach(b=>b.classList.toggle("on",b.dataset.style===name));
 localStorage.setItem("viceearth.mapStyle",name);
}

<style id="vice-v611-visible-feedback">
/* Visible and briefly held feedback even on very quick Android taps. */
button,.pill,[role="button"]{position:relative;-webkit-tap-highlight-color:transparent!important}
button.vice-pressed,.pill.vice-pressed,[role="button"].vice-pressed{
 transform:scale(.92)!important;
 filter:brightness(1.35)!important;
 box-shadow:0 0 0 2px rgba(255,112,219,.7),0 0 22px rgba(255,45,183,.45)!important;
 transition:transform 90ms ease-out,filter 90ms,box-shadow 90ms!important;
}

</style>
<script id="vice-v611-feedback">
(()=>{
 const pressed=new WeakMap();
 const find=(target)=>target?.closest?.('button,.pill,[role="button"]');
 const on=(el)=>{
   if(!el || el.disabled)return;
   clearTimeout(pressed.get(el));
   el.classList.add('vice-pressed');
   pressed.set(el,setTimeout(()=>el.classList.remove('vice-pressed'),240));
 };
 document.addEventListener('pointerdown',e=>{if(e.button!==0)return;on(find(e.target))},{passive:true,capture:true});
 document.addEventListener('pointerup',e=>{const el=find(e.target);if(!el)return;clearTimeout(pressed.get(el));pressed.set(el,setTimeout(()=>el.classList.remove('vice-pressed'),170))},{passive:true,capture:true});
 document.addEventListener('pointercancel',e=>{const el=find(e.target);if(el)el.classList.remove('vice-pressed')},{passive:true,capture:true});
 document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')on(find(e.target))},true);
})();
</script>

<script id="vice-v6126-place-panel-js">
(()=>{
 const panel=document.getElementById('vehicleSubpanel');
 const chips=document.getElementById('chips');
 const title=panel.querySelector('.vehicle-head strong');
 const choices=panel.querySelector('.vehicle-choices');
 const categories={
  'Veículos':['Todos','Carros','Motos','Barcos','Aviões','Raros'],
  'Lugares':['Todos','Praias','Cidades','Bairros','Pontos turísticos','Restaurantes','Lojas'],
  'Atividades':['Todos','Corridas','Esportes','Missões','Eventos','Entretenimento'],
  'Propriedades':['Todos','Casas','Apartamentos','Garagens','Negócios'],
  'Segredos':['Todos','Easter eggs','Locais escondidos','Mistérios'],
  'Colecionáveis':['Todos','Itens raros','Objetos especiais','Coleções'],
  'Serviços':['Todos','Oficinas','Postos','Hospitais','Lojas de roupas']
 };
 const hide=()=>panel.classList.remove('visible');
 const place=()=>{
  const r=chips.getBoundingClientRect();
  panel.style.top=Math.max(12,Math.min(window.innerHeight-panel.offsetHeight-12,r.bottom+9))+'px';
 };
 const show=(category)=>{
  title.textContent='';
  title.append(document.createTextNode(category.toUpperCase()+' '));
  const slash=document.createElement('span');slash.style.color='#ff65d4';slash.textContent='/';
  title.append(slash,document.createTextNode(' TIPOS'));
  choices.replaceChildren();
  categories[category].forEach((name,i)=>{
   const btn=document.createElement('button');
   btn.type='button';btn.className='vehicle-choice'+(i===0?' selected':'');btn.textContent=name;
   btn.addEventListener('click',()=>{
    choices.querySelectorAll('.vehicle-choice').forEach(b=>b.classList.toggle('selected',b===btn));
   });
   choices.append(btn);
  });
  panel.classList.add('visible');place();
 };
 chips.addEventListener('click',event=>{
  const chip=event.target.closest('[data-category]');
  if(!chip)return;
  const category=chip.dataset.category;
  if(categories[category]&&chip.classList.contains('on'))show(category);
  else hide();
 });
 // Menus principais sempre ficam livres de filtros flutuantes.
 const drawer=document.getElementById('drawer');
 const dismissForDrawer=()=>{
  if(drawer && getComputedStyle(drawer).display!=='none') hide();
 };
 document.getElementById('menu')?.addEventListener('click',hide,{capture:true});
 drawer && new MutationObserver(dismissForDrawer).observe(drawer,{attributes:true,attributeFilter:['style','class']});

 const markerSource='ve-guess-temp-source',markerLayer='ve-guess-temp-circle',markerHalo='ve-guess-temp-halo';
 function clearGuessMarker(){if(guessMap&&guessMap.getSource(markerSource))guessMap.getSource(markerSource).setData({type:'FeatureCollection',features:[]})}
 function ensureGuessMap(){const m=window.__veActiveMap;if(!m)return null;if(guessMap!==m){guessMap=m;m.on('dblclick',e=>{if(!guessScene)return;guessCoords=[e.lngLat.lng,e.lngLat.lat];ensureGuessMap();m.getSource(markerSource).setData({type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'Point',coordinates:guessCoords}}]});guessPanel.querySelector('.ve-guess-status').textContent='📍 Ponto selecionado! Dê dois cliques em outro lugar para reposicionar.';guessPanel.querySelector('#ve-guess-confirm').disabled=false;});}if(!m.getSource(markerSource)){m.addSource(markerSource,{type:'geojson',data:{type:'FeatureCollection',features:[]}});m.addLayer({id:markerHalo,type:'circle',source:markerSource,paint:{'circle-radius':18,'circle-color':'#f03ab9','circle-opacity':.18,'circle-stroke-color':'#ff82dc','circle-stroke-width':2}});m.addLayer({id:markerLayer,type:'circle',source:markerSource,paint:{'circle-radius':7,'circle-color':'#f33db9','circle-stroke-color':'#ffffff','circle-stroke-width':3}});}return m}
 function endGuess(){if(guessMap?.doubleClickZoom)guessMap.doubleClickZoom.enable();guessScene=null;guessCoords=null;clearGuessMarker();guessPanel.classList.remove('visible');document.body.classList.remove('ve-guess-active')}
 function beginGuess(id){const scene=scenes.find(x=>x.id===id);if(!scene)return;endGuess();guessScene=scene;modal.classList.remove('visible');guessPanel.querySelector('.ve-guess-title').textContent=scene.title+' · '+scene.id;guessPanel.querySelector('.ve-guess-status').textContent='⌖ Dê dois cliques no mapa para escolher um ponto.';guessPanel.querySelector('#ve-guess-confirm').disabled=true;guessPanel.classList.add('visible');document.body.classList.add('ve-guess-active');const activeMap=ensureGuessMap();if(activeMap?.doubleClickZoom)activeMap.doubleClickZoom.disable()}
 guessPanel.querySelector('#ve-guess-cancel').addEventListener('click',endGuess);
 guessPanel.querySelector('#ve-guess-cancel-top').addEventListener('click',endGuess);
 guessPanel.querySelector('#ve-guess-confirm').addEventListener('click',()=>{if(!guessScene||!guessCoords)return;guessPanel.querySelector('.ve-guess-status').textContent='✓ Palpite registrado apenas nesta demonstração. Ainda não há validação nem XP.';guessPanel.querySelector('#ve-guess-confirm').disabled=true;/* Não enviar coordenadas nem revelar resposta nesta versão. */});
 const grid=modal.querySelector('#ve-scene-grid');
 const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let spotlightIndex=0;
 let spotlightOrigin='Todos';
 function renderGallery(origin){
   spotlightOrigin=origin;
   if(origin!=='Todos'&&origin!=='Trailer 1'){
     grid.innerHTML='<div class="ve-gallery-wait">Novas cenas desta categoria em breve.</div>';
   }else{
     const scene=scenes[spotlightIndex];
     grid.innerHTML=`<section class="ve-spotlight" aria-label="Cena ${spotlightIndex+1} de ${scenes.length}">
       <div class="ve-spotlight-image"><img src="${scene.image}" alt="${esc(scene.title)}" decoding="async"><span class="ve-spotlight-id">${esc(scene.id)}</span><span class="ve-spotlight-time">◷ ${Math.floor(scene.t/60)}:${String(scene.t%60).padStart(2,"0")}</span></div>
       <div class="ve-spotlight-details"><div class="ve-spotlight-heading"><h3>${esc(scene.title)}</h3><span class="ve-spotlight-count">${spotlightIndex+1} / ${scenes.length}</span></div><p>${esc(scene.clue)}</p>
       <div class="ve-spotlight-actions"><button type="button" data-explore="${esc(scene.id)}">⌖ Explorar mapa</button><button type="button" class="ve-watch-inline" data-watch="${esc(scene.id)}">▶ Ver trecho</button></div></div>
       <div class="ve-spotlight-nav"><button type="button" class="ve-spotlight-prev" aria-label="Cena anterior">‹</button><div class="ve-spotlight-dots" aria-label="Indicador de cenas">${scenes.map((_,i)=>`<button type="button" class="${i===spotlightIndex?'active':''}" data-spot="${i}" aria-label="Ir para cena ${i+1}" aria-current="${i===spotlightIndex?'true':'false'}"></button>`).join('')}</div><button type="button" class="ve-spotlight-next" aria-label="Próxima cena">›</button></div>
       <div class="ve-spotlight-hint">Deslize para o lado ou use as setas para mudar de cena</div>
     </section>`;
   }
   modal.querySelector('.ve-gallery-foot').textContent=origin==='Todos'||origin==='Trailer 1'?'8 cenas catalogadas · Sem respostas públicas · XP em breve':'Nenhuma cena nesta categoria';
 }
 function moveSpotlight(delta){spotlightIndex=(spotlightIndex+delta+scenes.length)%scenes.length;renderGallery(spotlightOrigin)}
 grid.addEventListener('click',e=>{
   const explore=e.target.closest('[data-explore]');if(explore){beginGuess(explore.dataset.explore);return;}
   const watch=e.target.closest('[data-watch]');if(watch){openTrailerPlayer(watch.dataset.watch);return;}
   if(e.target.closest('.ve-spotlight-prev'))moveSpotlight(-1);
   else if(e.target.closest('.ve-spotlight-next'))moveSpotlight(1);
   else if(e.target.closest('[data-spot]')){spotlightIndex=Number(e.target.closest('[data-spot]').dataset.spot);renderGallery(spotlightOrigin)}
 });
 let swipeStart=null;
 grid.addEventListener('touchstart',e=>{if(e.touches.length===1)swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
 grid.addEventListener('touchend',e=>{if(!swipeStart||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-swipeStart.x,dy=e.changedTouches[0].clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4)moveSpotlight(dx<0?1:-1)},{passive:true});
 renderGallery('Todos');
 modal.querySelectorAll('[data-origin]').forEach(btn=>btn.addEventListener('click',()=>{
   modal.querySelectorAll('[data-origin]').forEach(x=>x.classList.toggle('active',x===btn));
   spotlightIndex=0;renderGallery(btn.dataset.origin);
 }));

 const player=document.createElement('div');player.id='ve-trailer-player';player.setAttribute('role','dialog');player.setAttribute('aria-modal','true');player.setAttribute('aria-label','Assistir trecho do trailer');
 player.innerHTML='<div class="ve-player-panel"><div class="ve-player-head"><strong>▶ TRECHO DO TRAILER 1</strong><button type="button" class="ve-player-close" aria-label="Fechar vídeo">×</button></div><div class="ve-player-frame"></div><div class="ve-player-caption"></div><p>O vídeo começa pausado. Toque no Play para assistir. O YouTube pode exibir controles ou anúncios conforme o dispositivo.</p></div>';
 document.body.append(player);
 const closeTrailerPlayer=()=>{player.classList.remove('visible');player.querySelector('.ve-player-frame').replaceChildren()};
 function openTrailerPlayer(id){const scene=scenes.find(x=>x.id===id);if(!scene)return;const frame=document.createElement('iframe');frame.title='Trailer 1 — '+scene.title;frame.allow='encrypted-media; picture-in-picture; fullscreen';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';frame.src='https://www.youtube-nocookie.com/embed/QdBZY2fkU-0?start='+scene.t+'&autoplay=0&playsinline=1&rel=0';player.querySelector('.ve-player-frame').replaceChildren(frame);player.querySelector('.ve-player-caption').textContent=scene.id+' · '+scene.title+' · '+Math.floor(scene.t/60)+':'+String(scene.t%60).padStart(2,'0');player.classList.add('visible')}
 player.querySelector('.ve-player-close').addEventListener('click',closeTrailerPlayer);
 player.addEventListener('click',e=>{if(e.target===player)closeTrailerPlayer()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&player.classList.contains('visible'))closeTrailerPlayer()});
 const cinema=document.createElement('div');cinema.id='ve-cinema-preview';cinema.setAttribute('role','dialog');cinema.setAttribute('aria-modal','true');cinema.setAttribute('aria-label','Prévia cinematográfica da cena');
 cinema.innerHTML=`<div class="ve-cinema-panel"><div class="ve-cinema-head"><span class="ve-cinema-eyebrow">🎬 VICE EARTH · CENA EM DESTAQUE</span><button class="ve-cinema-close" type="button" aria-label="Fechar prévia">×</button></div><div class="ve-cinema-frame"><img alt="Cena ampliada do Trailer 1"></div><div class="ve-cinema-meta"><div><div class="ve-cinema-title"></div><div class="ve-cinema-clue"></div></div><span class="ve-cinema-id"></span></div><div class="ve-cinema-actions"><button type="button" class="ve-cinema-explore">⌖ Explorar mapa</button><a target="_blank" rel="noopener noreferrer" class="ve-cinema-watch">▶ Ver trecho</a></div><div class="ve-cinema-note">As localizações continuam ocultas · XP em breve</div></div>`;
 document.body.append(cinema);
 let activeScene=null;
 const closeCinema=()=>{cinema.classList.remove('visible');activeScene=null};
 const openCinema=id=>{const scene=scenes.find(x=>x.id===id);if(!scene)return;activeScene=scene;cinema.querySelector('.ve-cinema-frame img').src=scene.image;cinema.querySelector('.ve-cinema-title').textContent=scene.title;cinema.querySelector('.ve-cinema-clue').textContent=scene.clue;cinema.querySelector('.ve-cinema-id').textContent=scene.id;cinema.querySelector('.ve-cinema-watch').href='https://www.youtube.com/watch?v=QdBZY2fkU-0&t='+scene.t+'s';cinema.classList.add('visible');cinema.querySelector('.ve-cinema-close').focus()};
 grid.addEventListener('click',e=>{const art=e.target.closest('.ve-scene-photo');if(art){const card=art.closest('.ve-scene-card');const index=Array.from(grid.querySelectorAll('.ve-scene-card')).indexOf(card);if(index>=0)openCinema(scenes[index].id)}});
 grid.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ve-scene-photo')){e.preventDefault();e.target.click()}});
 cinema.querySelector('.ve-cinema-close').addEventListener('click',closeCinema);
 cinema.addEventListener('click',e=>{if(e.target===cinema)closeCinema()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cinema.classList.contains('visible')){e.stopImmediatePropagation();closeCinema()}},true);
 cinema.querySelector('.ve-cinema-explore').addEventListener('click',()=>{if(!activeScene)return;const id=activeScene.id;closeCinema();beginGuess(id)});
 modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('visible')});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('visible')});
})();
</script>
</body>
</html>
