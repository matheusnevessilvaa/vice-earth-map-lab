<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04020a">
<title>Vice Earth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Syncopate:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.css">
<style>
:root{--bg:#04020a;--card:rgba(10,6,22,.78);--pk:#ff3ec8;--ln:rgba(255,62,200,.35);--tx:#fff;--mu:#aaa1ba;--cyan:#25d8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif}
button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
#map{position:absolute;inset:0;background:#05030b;opacity:0;pointer-events:none;transition:opacity .9s ease}
body.map-active #map{opacity:1;pointer-events:auto}
.maplibregl-canvas{outline:none}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none!important}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pill{border:1px solid var(--ln);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pill.on{background:var(--pk);border-color:var(--pk)}
.sr{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}.sr>*{pointer-events:auto}
.logo{font:700 15px Syncopate,'Archivo Black',sans-serif;letter-spacing:.01em;background:linear-gradient(90deg,#ff8ae6,#ff2fb7 60%,#c43bff);-webkit-background-clip:text;background-clip:text;color:transparent}.logo b{font:inherit;color:#fff;-webkit-text-fill-color:#fff}
.search{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:999px;border:1px solid var(--ln);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.search input{flex:1;background:none;border:0;color:var(--tx);font-size:15px;min-width:0;outline:none}.search svg{flex:none;opacity:.9}
.cta{background:var(--pk);border:0;border-radius:999px;padding:16px;font:600 17px Inter,sans-serif;box-shadow:0 0 24px var(--ln)}
#app{display:none;z-index:12}
#top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;flex-direction:column;gap:10px;max-width:480px}
#bar{display:flex;justify-content:space-between;align-items:center}#bar button{background:none;border:0;font-size:22px;padding:6px;min-width:44px;min-height:44px}
#res{display:none;padding:6px;max-height:44vh;overflow:auto}
#res button,.item{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:8px;border-radius:12px;color:#fff}
#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#fab{position:absolute;right:12px;top:42%;display:flex;flex-direction:column;gap:10px}
#fab button{width:46px;height:46px;border-radius:14px;border:1px solid var(--ln);background:var(--card);font-size:20px;backdrop-filter:blur(14px)}
#sheet{position:absolute;left:10px;right:10px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:480px;padding:12px;display:none}
.img{width:100%;height:120px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:48px}.th{width:64px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
#sheet h2{margin:10px 0 4px;font-size:18px}.mu{color:var(--mu);font-size:13px}.row2{display:flex;gap:10px;margin-top:12px}.row2 button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--ln);background:#1b1230;font-weight:600}.row2 .pri{background:var(--pk);border-color:var(--pk)}
#drawer{position:absolute;inset:0;background:rgba(4,2,10,.97);display:none;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(40px + env(safe-area-inset-bottom,0px));z-index:30}
#drawer h3{font-size:18px;margin:18px 0 10px}.item{border:1px solid var(--ln);margin-bottom:8px;background:#0e0820}
#toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--pk);padding:10px 16px;border-radius:999px;font-weight:600;display:none;z-index:80;max-width:calc(100vw - 30px);text-align:center}
#demoBadge{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;font-size:10px;letter-spacing:.08em;color:#cbbfd8;background:rgba(4,2,10,.72);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 9px;white-space:nowrap;pointer-events:none}
#app #bar,#app .search{opacity:0;transition:opacity .8s ease}#app.t1 #bar,#app.t1 .search{opacity:1}#app #chips,#app #fab{opacity:0;transition:opacity .8s ease}#app.t2 #chips,#app.t2 #fab{opacity:1}
@media (min-width:900px){#top{top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:auto;width:400px}#chips{flex-wrap:wrap;overflow:visible}#fab{right:20px;top:auto;bottom:56px}#sheet{left:20px;right:auto;width:400px;bottom:56px}#drawer{left:auto;width:440px;border-left:1px solid var(--ln);backdrop-filter:blur(16px)}}
/* Splash */
#splash{z-index:20;overflow:hidden;background:#030208;transition:opacity .95s ease,visibility .95s ease}
#splashArt{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}#splashArt picture,#splashArt img{display:block;width:100%;height:100%}#splashArt img{object-fit:cover;object-position:center;transform:scale(1);filter:brightness(.92) saturate(1.03);transition:transform 1.45s cubic-bezier(.22,.61,.36,1),filter 1s ease;will-change:transform,filter}
#splashArt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 18% 52%,rgba(3,2,8,.72),rgba(3,2,8,.48) 31%,transparent 62%),linear-gradient(90deg,rgba(3,2,8,.38),transparent 52%),linear-gradient(180deg,rgba(3,2,8,.08),transparent 48%,rgba(3,2,8,.34));pointer-events:none}
#hero{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));padding:0 22px;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;z-index:2;transition:opacity .6s ease,transform 1.1s ease}#hero button{pointer-events:auto}
.mark{margin:0;font:700 clamp(24px,8vw,40px)/1 Syncopate,'Archivo Black',Impact,sans-serif;letter-spacing:.01em;white-space:nowrap}.mark .v{background:linear-gradient(90deg,#ff8ae6,#ff2fb7 60%,#c43bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #ff3ec855)}.mark .e{color:#fff}
#hero small{display:block;margin-top:12px;font:500 clamp(7.5px,2.2vw,10px)/1 Inter,sans-serif;letter-spacing:.5em;color:#cfc3e6;white-space:nowrap}
#bot{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px;margin-top:22px}#bot .search{text-align:left;background:rgba(20,18,32,.55);border:1px solid #ffffff38;box-shadow:inset 0 -1px 0 #ff3ec880;padding:14px 18px;color:#cfc8dc}#bot .search span{font-size:14px;color:#b9b1c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bot .cta{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;background:linear-gradient(90deg,#ff5fc6,#ff2fb7);padding:16px;box-shadow:0 0 26px #ff3ec84d;transition:transform .25s,box-shadow .25s,filter .25s}#bot .cta:active{transform:scale(.97);filter:brightness(.95)}
.tag{display:flex;align-items:center;gap:14px;margin:6px 0 0;font:400 12.5px/1.4 Inter,sans-serif;color:#c9c0d9}.tag::before,.tag::after{content:"";flex:1;height:1px;background:#ffffff22}
#splash.transitioning #splashArt img,#splash.out #splashArt img{transform:scale(1.11);filter:brightness(.55) saturate(1.08)}#splash.transitioning #hero,#splash.out #hero{opacity:0;transform:translateY(24px)}#splash.out{opacity:0;visibility:hidden;pointer-events:none}
@media (min-width:900px) and (orientation:landscape){#hero{left:clamp(32px,6vw,110px);right:auto;top:50%;bottom:auto;width:min(560px,44vw);padding:0;align-items:flex-start;text-align:left;transform:translateY(-50%)}#splash.transitioning #hero,#splash.out #hero{transform:translate(-30px,-50%)}.mark{font-size:clamp(34px,3.7vw,56px)}#hero small{font-size:clamp(9px,.85vw,12px);margin-top:16px}#bot{max-width:none;margin-top:36px}#bot .search{padding:18px 22px}#bot .search span{font-size:16px}#bot .cta{padding:19px;font-size:18px}.tag{font-size:14px}}
@media (max-width:899px),(orientation:portrait){#hero{bottom:calc(38px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:20px}#splashArt::after{background:linear-gradient(180deg,rgba(3,2,8,.02) 0%,rgba(3,2,8,.06) 34%,rgba(3,2,8,.76) 67%,rgba(3,2,8,.97) 100%)}#splashArt img{object-position:center top}.tag{font-size:12px}}
@media (prefers-reduced-motion:reduce){#map,#splash,#splashArt img,#hero,#app #bar,#app .search,#app #chips,#app #fab{transition-duration:.01ms!important}#splash.transitioning #splashArt img,#splash.out #splashArt img{transform:none}}
</style>
</head>
<body>
<div id="map" aria-label="Mapa interativo demonstrativo"></div>

<div id="splash" class="sr">
  <div id="splashArt" aria-hidden="true"><picture><source media="(max-width:899px), (orientation:portrait)" srcset="splash-mobile.webp"><img src="splash-desktop.webp" alt=""></picture></div>
  <div id="hero">
    <h1 class="mark"><span class="v">VICE</span> <span class="e">EARTH</span></h1>
    <small>MAPA COMUNITÁRIO DE LEONIDA</small>
    <div id="bot">
      <button class="search" id="s0" aria-label="Buscar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Buscar lugar, atividade ou descoberta...</span></button>
      <button class="cta" id="go"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.5l7 3 3 7z"/></svg><span>Explorar Leonida</span></button>
      <p class="tag">Explore Leonida e acompanhe descobertas da comunidade.</p>
    </div>
  </div>
</div>

<div id="app" class="sr">
  <div id="top">
    <div id="bar"><button id="back" aria-label="Voltar">←</button><span class="logo" style="font-size:14px">VICE <b>EARTH</b></span><button id="menu" aria-label="Explorar regiões">☰</button></div>
    <div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Buscar lugar, atividade ou descoberta..." autocomplete="off"></div>
    <div id="res" class="panel"></div><div id="chips"></div>
  </div>
  <div id="fab"><button id="zi" aria-label="Aproximar">+</button><button id="zo" aria-label="Afastar">−</button><button id="tilt" aria-label="Alternar visão 2D e 3D">3D</button></div>
  <div id="sheet" class="panel"></div>
  <div id="drawer">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="logo" style="font-size:14px">VICE <b>EARTH</b></span><button id="x" class="pill">Fechar</button></div>
    <h3 id="dt">Explorar regiões</h3><div id="reg"></div>
    <h3>Mais opções</h3>
    <button class="item" data-o="saved"><span class="th">🔖</span><div><b>Salvos</b><div class="mu">Seus lugares favoritos</div></div></button>
    <button class="item" data-o="soon"><span class="th">🕒</span><div><b>Descobertas recentes</b><div class="mu">Veja o que a comunidade encontrou</div></div></button>
    <button class="item" data-o="add"><span class="th">➕</span><div><b>Adicionar descoberta</b><div class="mu">Contribua com o mapa</div></div></button>
    <button class="item" data-o="soon"><span class="th">👥</span><div><b>Comunidade</b><div class="mu">Descobertas de outros usuários</div></div></button>
  </div>
  <div id="demoBadge">DEMO · geografia fictícia e substituível</div>
</div>
<div id="toast"></div>

<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.mjs';

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]));
const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2400)};
const G=(a,b)=>`linear-gradient(135deg,${a},${b})`;
const mk=(id,name,kind,parent,lon,lat,zoom,d,e,g,category)=>({id,name,kind,parent,lon,lat,zoom,d,e,g,category:category||null,placeholder:true});
const CONFIG={storageKey:"viceearth.v2",center:[-80.19,25.79],zoom:8.6,levels:{region:7.9,city:10.2,poi:12.5}};

/* Dados demonstrativos: nomes/proximidades são placeholders; a cartografia desenhada abaixo é inteiramente fictícia. */
const PLACEHOLDER=[
 mk("leonida","Leonida","country",null,-80.19,25.79,7.8,"Visão demonstrativa do estado.","🌴",G("#ff3ec8","#2a0f5a")),
 mk("vice-city","Vice City","region","leonida",-80.19,25.79,10.2,"Vida noturna, praias e muito mais.","🌆",G("#ff7a59","#7a2bd6")),
 mk("keys","Leonida Keys","region","leonida",-79.78,25.37,9.6,"Ilhas, pontes e paraísos escondidos.","🏝️",G("#27d3ff","#1b6b8a")),
 mk("gellhorn","Port Gellhorn","region","leonida",-80.78,26.10,9.6,"Porto, áreas industriais e interior.","⚓",G("#4a6fa5","#1d2b4a")),
 mk("ambrosia","Ambrosia","region","leonida",-80.47,25.98,9.7,"Cidades menores e áreas rurais.","🌾",G("#ff9a3c","#7a3b2e")),
 mk("grassrivers","Grassrivers","region","leonida",-80.47,25.56,9.7,"Pântanos, vida selvagem e mistérios.","🐊",G("#37a35a","#143d2a")),
 mk("kalaga","Mount Kalaga","region","leonida",-80.05,26.12,9.7,"Montanhas, florestas e áreas remotas.","⛰️",G("#6a8caf","#2b3a55")),
 mk("vc-centro","Vice City — Centro","city","vice-city",-80.18,25.79,13.5,"Centro urbano demonstrativo.","🏙️",G("#c9a7ff","#4a1b7a")),
 mk("vc-orla","Orla","district","vice-city",-80.09,25.76,14.1,"Faixa litorânea demonstrativa.","🌅",G("#ffb36b","#e0457b")),
 mk("vc-criativo","Distrito criativo","district","vice-city",-80.22,25.84,14.2,"Bairro demonstrativo de arte e vida noturna.","🎨",G("#8fd3ff","#3a2a8a")),
 mk("vc-financeiro","Distrito financeiro","district","vice-city",-80.15,25.84,14.3,"Torres e escritórios demonstrativos.","🏢",G("#8fd3ff","#1b4a6a")),
 mk("ocean-drive","Ocean Drive","poi","vc-orla",-80.075,25.74,15.5,"Ponto demonstrativo da orla.","📷",G("#ff7a59","#c2338a"),"Lugares"),
 mk("vice-beach","Vice Beach","poi","vc-orla",-80.055,25.79,15.3,"Praia demonstrativa.","🏖️",G("#ffb36b","#e0457b"),"Lugares"),
 mk("vice-port","Vice Port","poi","vc-centro",-80.15,25.73,15.1,"Porto demonstrativo.","🚢",G("#4a6fa5","#1d2b4a"),"Lugares"),
 mk("clube","Clube noturno","poi","vc-criativo",-80.225,25.845,16,"Exemplo de atividade enviada pela comunidade.","🎵",G("#7a2bd6","#2a0f5a"),"Atividades"),
 mk("garagem","Garagem Wynwood","poi","vc-criativo",-80.205,25.825,16,"Exemplo de ponto de veículos.","🏎️",G("#7a6bff","#2a2a6a"),"Veículos"),
 mk("cobertura","Cobertura Brickell","poi","vc-financeiro",-80.145,25.825,16,"Exemplo de propriedade no mapa.","🏢",G("#27d3ff","#1b4a6a"),"Propriedades"),
 mk("bunker","Bunker nos pântanos","poi","grassrivers",-80.50,25.55,14.3,"Exemplo de segredo não confirmado.","🔒",G("#37e07a","#0f3b26"),"Segredos")
];
const Store={get(){try{return JSON.parse(localStorage.getItem(CONFIG.storageKey))||{}}catch{return{}}},set(o){try{localStorage.setItem(CONFIG.storageKey,JSON.stringify(o))}catch{}}};
const DataSource={async list(){return[...PLACEHOLDER,...(Store.get().discoveries||[])]},async add(p){const s=Store.get();s.discoveries=[...(s.discoveries||[]),p];Store.set(s);return p},savedIds(){return new Set(Store.get().saved||[])},setSaved(set){const s=Store.get();s.saved=[...set];Store.set(s)}};

const blankStyle={version:8,sources:{},layers:[{id:"bg",type:"background",paint:{"background-color":"#06030d"}}]};
const demoGeo={type:"FeatureCollection",features:[
 {type:"Feature",properties:{kind:"land"},geometry:{type:"Polygon",coordinates:[[[-80.95,26.22],[-80.72,26.31],[-80.48,26.25],[-80.28,26.34],[-80.01,26.28],[-79.82,26.08],[-79.68,25.78],[-79.72,25.49],[-79.91,25.27],[-80.12,25.21],[-80.34,25.30],[-80.56,25.43],[-80.73,25.64],[-80.89,25.89],[-80.95,26.22]]]}},
 {type:"Feature",properties:{kind:"water"},geometry:{type:"Polygon",coordinates:[[[-80.16,25.98],[-79.88,26.02],[-79.72,25.87],[-79.70,25.61],[-79.84,25.45],[-80.04,25.49],[-80.13,25.67],[-80.16,25.98]]]}},
 {type:"Feature",properties:{kind:"island"},geometry:{type:"Polygon",coordinates:[[[-79.96,25.50],[-79.81,25.45],[-79.73,25.34],[-79.83,25.28],[-80.00,25.33],[-80.05,25.42],[-79.96,25.50]]]}},
 {type:"Feature",properties:{kind:"city"},geometry:{type:"Polygon",coordinates:[[[-80.31,25.92],[-80.06,25.93],[-79.98,25.80],[-80.02,25.66],[-80.21,25.63],[-80.34,25.72],[-80.31,25.92]]]}},
 {type:"Feature",properties:{kind:"district"},geometry:{type:"LineString",coordinates:[[-80.30,25.82],[-80.03,25.82],[-79.99,25.73],[-80.23,25.69],[-80.30,25.82]]}},
 {type:"Feature",properties:{kind:"road"},geometry:{type:"LineString",coordinates:[[-80.84,25.95],[-80.61,25.88],[-80.39,25.84],[-80.18,25.81],[-79.97,25.74]]}},
 {type:"Feature",properties:{kind:"road"},geometry:{type:"LineString",coordinates:[[-80.48,26.20],[-80.42,26.02],[-80.34,25.86],[-80.23,25.69],[-80.02,25.42]]}},
 {type:"Feature",properties:{kind:"road"},geometry:{type:"LineString",coordinates:[[-80.20,25.91],[-80.18,25.79],[-80.14,25.66]]}},
 {type:"Feature",properties:{kind:"bridge"},geometry:{type:"LineString",coordinates:[[-80.03,25.63],[-79.91,25.51],[-79.86,25.40]]}}
]};

const BaseMap={
 map:null,
 async load(){
  this.map=new maplibregl.Map({container:"map",style:blankStyle,center:CONFIG.center,zoom:CONFIG.zoom,pitch:0,bearing:0,attributionControl:false,maxPitch:65,minZoom:6,maxZoom:18});
  await new Promise((ok,fail)=>{this.map.once("load",ok);this.map.once("error",e=>{console.warn(e.error||e);});setTimeout(ok,3000)});
  if(!this.map.getSource("demo"))this.map.addSource("demo",{type:"geojson",data:demoGeo});
  this.map.addLayer({id:"land",type:"fill",source:"demo",filter:["==",["get","kind"],"land"],paint:{"fill-color":"#120c20","fill-outline-color":"#3b2458"}});
  this.map.addLayer({id:"water",type:"fill",source:"demo",filter:["==",["get","kind"],"water"],paint:{"fill-color":"#071b2a","fill-opacity":.92}});
  this.map.addLayer({id:"island",type:"fill",source:"demo",filter:["==",["get","kind"],"island"],paint:{"fill-color":"#151124","fill-outline-color":"#583873"}});
  this.map.addLayer({id:"cityArea",type:"fill",source:"demo",filter:["==",["get","kind"],"city"],paint:{"fill-color":"#36143e","fill-opacity":.5,"fill-outline-color":"#ff3ec8"}});
  this.map.addLayer({id:"district",type:"line",source:"demo",filter:["==",["get","kind"],"district"],paint:{"line-color":"#8f77ff","line-opacity":.55,"line-width":1.4,"line-dasharray":[2,2]}});
  this.map.addLayer({id:"roads",type:"line",source:"demo",filter:["in",["get","kind"],["literal",["road","bridge"]]],paint:{"line-color":["match",["get","kind"],"bridge","#25d8ff","#8d78a8"],"line-opacity":.65,"line-width":["interpolate",["linear"],["zoom"],7,.6,15,3.2]}});
  return this.map;
 },
 fly(lon,lat,zoom=14){this.map.flyTo({center:[lon,lat],zoom,pitch:this.map.getPitch(),duration:1350,essential:true})},
 home(){this.map.flyTo({center:CONFIG.center,zoom:CONFIG.zoom,pitch:0,bearing:0,duration:1100,essential:true})},
 set3D(on){this.map.easeTo({pitch:on?52:0,bearing:on?-18:0,duration:700,essential:true})}
};

const COR={Lugares:"#ff3ec8",Veículos:"#7a6bff",Atividades:"#ffc233",Propriedades:"#27d3ff",Segredos:"#37e07a",country:"#ffffff",region:"#ff3ec8",city:"#c9a7ff",district:"#8fd3ff",poi:"#ff3ec8",discovery:"#ff3ec8"};
const Markers={all:[],cat:null,src:{type:"FeatureCollection",features:[]},init(map){this.map=map;map.addSource("places",{type:"geojson",data:this.src,cluster:true,clusterMaxZoom:13,clusterRadius:48});
 map.addLayer({id:"clusters",type:"circle",source:"places",filter:["has","point_count"],paint:{"circle-color":"#1a0d33","circle-radius":["step",["get","point_count"],16,10,20,30,25],"circle-stroke-color":"#ff3ec8","circle-stroke-width":2}});
 map.addLayer({id:"cluster-count",type:"symbol",source:"places",filter:["has","point_count"],layout:{"text-field":["get","point_count_abbreviated"],"text-size":12},paint:{"text-color":"#fff"}});
 map.addLayer({id:"points",type:"circle",source:"places",filter:["!",["has","point_count"]],paint:{"circle-radius":["interpolate",["linear"],["zoom"],7,4,16,9],"circle-color":["get","color"],"circle-stroke-width":2,"circle-stroke-color":"#fff"}});
 map.addLayer({id:"labels",type:"symbol",source:"places",filter:["!",["has","point_count"]],minzoom:7.4,layout:{"text-field":["get","name"],"text-font":["Open Sans Semibold"],"text-size":["interpolate",["linear"],["zoom"],7,11,15,14],"text-offset":[0,1.25],"text-anchor":"top","text-allow-overlap":false},paint:{"text-color":"#fff","text-halo-color":"#09050f","text-halo-width":2}});
 map.on("click","clusters",async e=>{const f=e.features&&e.features[0];if(!f)return;const id=f.properties.cluster_id;const z=await map.getSource("places").getClusterExpansionZoom(id);map.easeTo({center:f.geometry.coordinates,zoom:z,duration:500})});
 map.on("click","points",e=>{const f=e.features&&e.features[0];if(!f)return;const p=this.all.find(x=>x.id===f.properties.id);if(p)select(p)});
 ["clusters","points"].forEach(id=>{map.on("mouseenter",id,()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave",id,()=>map.getCanvas().style.cursor="")});
 },
 add(p){this.all.push(p);this.refresh()},
 refresh(){if(!this.map||!this.map.getSource("places"))return;const z=this.map.getZoom();this.src.features=this.all.filter(p=>{const visible=p.kind==="country"?z<8.5:p.kind==="region"?z>=7.4&&z<11:p.kind==="city"||p.kind==="district"?z>=9.6&&z<13.2:z>=11.8;return visible&&(!this.cat||p.kind!=="poi"&&p.kind!=="discovery"||p.category===this.cat)}).map(p=>({type:"Feature",properties:{id:p.id,name:p.name,kind:p.kind,category:p.category||"",color:COR[p.category]||COR[p.kind]||"#ff3ec8"},geometry:{type:"Point",coordinates:[p.lon,p.lat]}}));this.map.getSource("places").setData(this.src)},
 fly(p){BaseMap.fly(p.lon,p.lat,p.zoom||14)}
};

const KIND={country:"Estado",region:"Região",city:"Cidade",district:"Bairro",poi:"Ponto de interesse",discovery:"Descoberta"};
const byId={};let saved=new Set();
function item(p){const b=document.createElement("button");b.className="item";const sub=p.kind==="region"?p.d:KIND[p.kind]+(p.parent&&byId[p.parent]?" · "+byId[p.parent].name:"");b.innerHTML=`<span class="th" style="background:${p.g}">${p.e}</span><div><b>${esc(p.name)}</b><div class="mu">${esc(sub)}</div></div>`;return b}
function list(box,arr,onPick){box.innerHTML="";arr.forEach(p=>{const b=item(p);b.onclick=()=>onPick(p);box.appendChild(b)});if(!arr.length)box.innerHTML='<div class="mu" style="padding:10px">Nada por aqui ainda.</div>'}
function select(p){$("#drawer").style.display="none";$("#res").style.display="none";const s=$("#sheet"),par=p.parent&&byId[p.parent];s.style.display="block";s.innerHTML=`<div class="img" style="background:${p.g}">${p.e}</div><h2>${esc(p.name)}</h2><div class="mu">${KIND[p.kind]}${par?" · "+esc(par.name):""}</div><div style="margin-top:6px">${esc(p.d)}</div><div class="row2"><button id="vm">Ver no mapa</button><button class="pri" id="sv">${saved.has(p.id)?"Salvo ✓":"Salvar"}</button></div>`;$("#vm").onclick=()=>Markers.fly(p);$("#sv").onclick=e=>{saved.has(p.id)?saved.delete(p.id):saved.add(p.id);DataSource.setSaved(saved);e.target.textContent=saved.has(p.id)?"Salvo ✓":"Salvar"};Markers.fly(p)}

let mapReady=false,phase="splash",adding=false,is3D=false;
async function bootMap(){if(mapReady)return;try{const map=await BaseMap.load();saved=DataSource.savedIds();Markers.init(map);(await DataSource.list()).forEach(p=>{byId[p.id]=p;Markers.add(p)});map.on("zoomend",()=>Markers.refresh());map.on("moveend",()=>Markers.refresh());
 ["Lugares","Veículos","Atividades","Propriedades","Segredos"].forEach(c=>{const b=document.createElement("button");b.className="pill";b.textContent=c;b.onclick=()=>{Markers.cat=Markers.cat===c?null:c;[...$("#chips").children].forEach(x=>x.classList.toggle("on",x.textContent===Markers.cat));Markers.refresh()};$("#chips").appendChild(b)});
 map.on("click",e=>{if(!adding)return;adding=false;const n=prompt("Nome da descoberta:");if(!n)return;const p={id:"u"+Date.now(),name:n.slice(0,60),kind:"discovery",category:"Lugares",parent:null,lon:e.lngLat.lng,lat:e.lngLat.lat,zoom:15,d:"Descoberta adicionada por você (experimental, salva só neste aparelho).",e:"📍",g:G("#ff3ec8","#4a1b7a"),placeholder:false};DataSource.add(p);byId[p.id]=p;Markers.add(p);toast("Descoberta adicionada");Markers.fly(p)});
 mapReady=true}catch(e){console.error(e);toast("Não foi possível iniciar o mapa")}}

async function enter(after){if(phase!=="splash")return;phase="entering";const splash=$("#splash"),app=$("#app");splash.classList.add("transitioning");await bootMap();setTimeout(()=>{document.body.classList.add("map-active");app.style.display="block";requestAnimationFrame(()=>{app.classList.add("t1");setTimeout(()=>app.classList.add("t2"),260)});splash.classList.add("out");setTimeout(()=>{splash.style.display="none";splash.classList.remove("transitioning");phase="app";if(mapReady)BaseMap.map.resize();if(after)after()},880)},420)}
function returnHome(){if(phase!=="app")return;phase="returning";["#sheet","#drawer","#res"].forEach(s=>$(s).style.display="none");const splash=$("#splash"),app=$("#app");app.classList.remove("t1","t2");splash.style.display="block";requestAnimationFrame(()=>{splash.classList.remove("out");document.body.classList.remove("map-active")});setTimeout(()=>{app.style.display="none";phase="splash"},900)}

$("#go").onclick=()=>enter();$("#s0").onclick=()=>enter(()=>$("#q").focus());$("#back").onclick=returnHome;
$("#q").oninput=e=>{const t=e.target.value.toLowerCase().trim(),r=$("#res");if(!t){r.style.display="none";return}list(r,Markers.all.filter(p=>p.name.toLowerCase().includes(t)||(p.category||"").toLowerCase().includes(t)),select);r.style.display="block"};
const openList=(title,arr)=>{$("#dt").textContent=title;list($("#reg"),arr,select);$("#drawer").style.display="block"};
$("#menu").onclick=()=>openList("Explorar regiões",Markers.all.filter(p=>p.kind==="region"));$("#x").onclick=()=>$("#drawer").style.display="none";
document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const o=b.dataset.o;if(o==="saved"){$("#dt").textContent="Salvos";list($("#reg"),Markers.all.filter(p=>saved.has(p.id)),select)}else if(o==="add"){adding=true;$("#drawer").style.display="none";toast("Toque no mapa para marcar a descoberta")}else toast("Em breve")});
$("#zi").onclick=()=>mapReady&&BaseMap.map.zoomIn({duration:300});$("#zo").onclick=()=>mapReady&&BaseMap.map.zoomOut({duration:300});$("#tilt").onclick=()=>{if(!mapReady)return;is3D=!is3D;BaseMap.set3D(is3D);$("#tilt").textContent=is3D?"2D":"3D"};
</script>
</body>
</html>
