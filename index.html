<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vice Earth</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Syncopate:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/cesium@1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script>window.CESIUM_BASE_URL="https://cdn.jsdelivr.net/npm/cesium@1.120/Build/Cesium/";</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120/Build/Cesium/Cesium.js"></script>
<style>
:root{--bg:#04020a;--card:rgba(10,6,22,.72);--pk:#ff3ec8;--ln:rgba(255,62,200,.35);--tx:#fff;--mu:#a69bbb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif}
#globe{position:absolute;inset:0}
.cesium-viewer-toolbar,.cesium-viewer-bottom{z-index:40}
.logo{font:italic 26px 'Archivo Black',Impact,sans-serif;letter-spacing:-1px}
.logo b{color:var(--pk);text-shadow:0 0 14px var(--pk);font-weight:400;transform:skewX(-8deg);display:inline-block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.pill{border:1px solid var(--ln);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--pk);border-color:var(--pk)}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:16px}
.sr{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.sr>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:999px;border:1px solid var(--ln);background:var(--card)}
.search input{flex:1;background:none;border:0;color:var(--tx);font-size:15px;min-width:0}
.cta{background:var(--pk);border:0;border-radius:999px;padding:16px;font:600 17px Inter,sans-serif;box-shadow:0 0 24px var(--ln)}
.com{display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left}
#app{display:none}
#top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;flex-direction:column;gap:10px;max-width:480px}
#bar{display:flex;justify-content:space-between;align-items:center}
#bar button{background:none;border:0;font-size:22px;padding:6px}
#res{display:none;padding:6px}
#res button,.item{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:8px;border-radius:12px}
#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#fab{position:absolute;right:12px;top:42%;display:flex;flex-direction:column;gap:10px}
#fab button{width:46px;height:46px;border-radius:14px;border:1px solid var(--ln);background:var(--card);font-size:20px}
#sheet{position:absolute;left:10px;right:10px;bottom:calc(30px + env(safe-area-inset-bottom,0px));max-width:480px;padding:12px;display:none}
.img{width:100%;height:120px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:48px}
.th{width:64px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.th{flex:none}#sheet h2{margin:10px 0 4px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.ok{font:600 11px Inter;color:#37e07a;border:1px solid #37e07a55;border-radius:999px;padding:3px 9px}
.mu{color:var(--mu);font-size:13px}
.row2{display:flex;gap:10px;margin-top:12px}.row2 button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--ln);background:#1b1230;font-weight:600}
.row2 .pri{background:var(--pk);border-color:var(--pk)}
#drawer{position:absolute;inset:0;background:var(--bg);display:none;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 40px}
#drawer h3{font-size:18px;margin:18px 0 10px}
.item{border:1px solid var(--ln);margin-bottom:8px;background:#0e0820}
#toast{position:absolute;left:50%;top:80px;transform:translateX(-50%);background:var(--pk);padding:10px 16px;border-radius:999px;font-weight:600;display:none;z-index:60}

/* ===== ETAPA 2: identidade visual + entrada ===== */
.cesium-viewer-toolbar,.cesium-viewer-animationContainer,.cesium-viewer-timelineContainer{display:none!important}
.cesium-widget-credits{font-size:10px;opacity:.55}
.panel,.search,.pill,#fab button{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.search svg{flex:none;opacity:.9}
/* interface de exploração surge por etapas conforme o zoom */
#app #bar,#app .search{opacity:0;transition:opacity 1.4s ease}
#app.t1 #bar,#app.t1 .search{opacity:1}
#app #chips,#app #fab{opacity:0;transition:opacity 1.4s ease}
#app.t2 #chips,#app.t2 #fab{opacity:1}
#app:not(.t1) #top>*,#app:not(.t2) #chips,#app:not(.t2) #fab{pointer-events:none}
@media (min-width:900px){
 #top{top:calc(18px + env(safe-area-inset-top,0px));left:20px;right:auto;width:400px}
 #chips{flex-wrap:wrap;overflow:visible}
 #fab{right:20px;top:auto;bottom:56px}
 #sheet{left:20px;right:auto;width:400px;bottom:56px}
 #drawer{left:auto;width:440px;border-left:1px solid var(--ln);background:rgba(6,3,14,.9);backdrop-filter:blur(16px)}
}

/* ===== ETAPA 2 FINAL: tela inicial ===== */
#globe canvas{touch-action:none}
.logo{font:700 15px Syncopate,'Archivo Black',sans-serif;letter-spacing:.01em;background:linear-gradient(90deg,#ff8ae6,#ff2fb7 60%,#c43bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo b{font:inherit;color:#fff;-webkit-text-fill-color:#fff;transform:none;text-shadow:none}
#splash{background:radial-gradient(ellipse at 6% 50%,rgba(4,2,10,.9),rgba(4,2,10,.55) 34%,transparent 62%),linear-gradient(rgba(4,2,10,.7),transparent 20%,transparent 66%,rgba(4,2,10,.92));transition:opacity 2.6s ease}
#hero{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));padding:0 22px;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;transition:opacity 1.5s ease,transform 2.4s ease}
#hero button{pointer-events:auto}
.mark{margin:0;font:700 clamp(24px,8vw,40px)/1 Syncopate,'Archivo Black',Impact,sans-serif;letter-spacing:.01em;white-space:nowrap}
.mark .v{background:linear-gradient(90deg,#ff8ae6,#ff2fb7 60%,#c43bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #ff3ec855)}
.mark .e{color:#fff}
#hero small{display:block;margin-top:12px;font:500 clamp(7.5px,2.2vw,10px)/1 Inter,sans-serif;letter-spacing:.5em;color:#cfc3e6;white-space:nowrap}
#bot{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px;margin-top:22px}
#bot .search{text-align:left;background:rgba(20,18,32,.55);border:1px solid #ffffff38;box-shadow:inset 0 -1px 0 #ff3ec880;padding:14px 18px;color:#cfc8dc}
#bot .search span{font-size:14px;color:#b9b1c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bot .cta{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;background:linear-gradient(90deg,#ff5fc6,#ff2fb7);padding:16px;box-shadow:0 0 26px #ff3ec84d;transition:transform .25s,box-shadow .25s,filter .25s}
#bot .cta:hover{transform:translateY(-2px);box-shadow:0 0 40px #ff3ec88c;filter:brightness(1.08)}
#bot .cta:active{transform:scale(.97);filter:brightness(.95)}
.tag{display:flex;align-items:center;gap:14px;margin:6px 0 0;font:400 12.5px/1.4 Inter,sans-serif;color:#c9c0d9}
.tag::before,.tag::after{content:"";flex:1;height:1px;background:#ffffff22}
#splash.out #hero{opacity:0;transform:translateY(28px)}
#splash.out #hero button{pointer-events:none}
@media (min-width:900px) and (orientation:landscape){
 #hero{left:clamp(32px,6vw,110px);right:auto;top:50%;bottom:auto;width:min(560px,44vw);padding:0;align-items:flex-start;text-align:left;transform:translateY(-50%)}
 #splash.out #hero{transform:translate(-36px,-50%)}
 .mark{font-size:clamp(34px,3.7vw,56px)}
 #hero small{font-size:clamp(9px,.85vw,12px);margin-top:16px}
 #bot{max-width:none;margin-top:36px}
 #bot .search{padding:18px 22px}#bot .search span{font-size:16px}
 #bot .cta{padding:19px;font-size:18px}
 .tag{font-size:14px}
}
/* ===== ETAPA 2.1: planeta fora do centro =====
   Desktop: texto à esquerda, planeta no centro-direita. Celular: planeta em cima, texto embaixo.
   O canvas é estendido além da tela e o Cesium centraliza o planeta no canvas (sem mexer na câmera). */
@media (min-width:900px) and (orientation:landscape){#globe{right:-30vw}}
@media (max-width:899px),(orientation:portrait){#globe{top:-24vh}}
/* créditos do mapa (atribuição obrigatória) sempre visíveis, mesmo com o canvas maior que a tela */
.cesium-viewer-bottom{position:fixed!important;left:0;right:auto;bottom:0;z-index:70}

/* ===== HOME ILUSTRATIVA: splash desacoplada do mapa ===== */
#globe{
  position:absolute!important;inset:0!important;top:0!important;right:0!important;bottom:0!important;left:0!important;z-index:0;
  opacity:0;pointer-events:none;
  transition:opacity 1.05s ease;
  background:#04020a;
}
body.map-active #globe{opacity:1;pointer-events:auto}
#splash{
  z-index:20;
  overflow:hidden;
  background:#030208;
  transition:opacity 1.05s ease,visibility 1.05s ease;
}
#splashArt{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#splashArt picture,#splashArt img{display:block;width:100%;height:100%}
#splashArt img{
  object-fit:cover;
  object-position:center;
  transform:scale(1);
  filter:brightness(.92) saturate(1.03);
  transition:transform 1.8s cubic-bezier(.22,.61,.36,1),filter 1.2s ease;
  will-change:transform,filter;
}
#splashArt::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 18% 52%,rgba(3,2,8,.72) 0%,rgba(3,2,8,.48) 31%,transparent 62%),
    linear-gradient(90deg,rgba(3,2,8,.38),transparent 52%),
    linear-gradient(180deg,rgba(3,2,8,.08),transparent 48%,rgba(3,2,8,.34));
  pointer-events:none;
}
#hero{z-index:2}
#splash.transitioning #splashArt img,
#splash.out #splashArt img{transform:scale(1.105);filter:brightness(.62) saturate(1.07)}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash.out #hero{opacity:0}
#splash .tag{max-width:100%}

/* Na home não há Cesium, então não há atribuição sobre a interface.
   No mapa, a atribuição obrigatória permanece visível em uma faixa discreta. */
.cesium-viewer-bottom{
  position:fixed!important;
  left:8px!important;right:auto!important;
  bottom:max(6px,env(safe-area-inset-bottom,0px))!important;
  z-index:70!important;
  max-width:calc(100vw - 16px);
}
.cesium-widget-credits{
  display:flex!important;align-items:center;flex-wrap:wrap;gap:2px 5px;
  max-width:min(720px,calc(100vw - 16px));
  padding:3px 7px!important;
  border-radius:8px;
  background:rgba(3,2,8,.58);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  font-size:9px!important;
  line-height:1.15!important;
  opacity:.76!important;
}
#sheet{bottom:calc(48px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  #sheet{bottom:54px}
  #fab{bottom:54px}
}
@media (max-width:899px),(orientation:portrait){
  #hero{
    bottom:calc(52px + env(safe-area-inset-bottom,0px));
    padding-left:20px;padding-right:20px;
  }
  #splashArt::after{
    background:
      linear-gradient(180deg,rgba(3,2,8,.02) 0%,rgba(3,2,8,.06) 34%,rgba(3,2,8,.78) 70%,rgba(3,2,8,.96) 100%);
  }
  #splashArt img{object-position:center top}
  .tag{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  #globe,#splash,#splashArt img,#hero{transition-duration:.01ms!important}
  #splash.transitioning #splashArt img,#splash.out #splashArt img{transform:none}
}

</style>
</head>
<body>
<div id="globe"></div>

<div id="splash" class="sr">
  <div id="splashArt" aria-hidden="true">
    <picture>
      <source media="(max-width:899px), (orientation:portrait)" srcset="splash-mobile.webp">
      <img src="splash-desktop.webp" alt="">
    </picture>
  </div>
  <div id="hero">
    <h1 class="mark"><span class="v">VICE</span> <span class="e">EARTH</span></h1>
    <small>MAPA COMUNITÁRIO DE LEONIDA</small>
    <div id="bot">
      <button class="search" id="s0" aria-label="Buscar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Buscar lugar, atividade ou descoberta...</span></button>
      <button class="cta" id="go"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.5l7 3 3 7z"/></svg><span>Explorar Leonida</span></button>
      <p class="tag">Explore Leonida e acompanhe descobertas da comunidade.</p>
    </div>
  </div>
</div>

<div id="app" class="sr">
  <div id="top">
    <div id="bar"><button id="back" aria-label="Voltar">←</button><span class="logo" style="font-size:14px">VICE <b>EARTH</b></span><button id="menu" aria-label="Explorar regiões">☰</button></div>
    <div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Buscar lugar, atividade ou descoberta..." autocomplete="off"></div>
    <div id="res" class="panel"></div>
    <div id="chips"></div>
  </div>
  <div id="fab"><button id="zi" aria-label="Aproximar">+</button><button id="zo" aria-label="Afastar">−</button></div>
  <div id="sheet" class="panel"></div>
  <div id="drawer">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="logo" style="font-size:14px">VICE <b>EARTH</b></span><button id="x" class="pill">Fechar</button></div>
    <h3 id="dt">Explorar regiões</h3><div id="reg"></div>
    <h3>Mais opções</h3>
    <button class="item" data-o="saved"><span class="th">🔖</span><div><b>Salvos</b><div class="mu">Seus lugares favoritos</div></div></button>
    <button class="item" data-o="soon"><span class="th">🕒</span><div><b>Descobertas recentes</b><div class="mu">Veja o que a comunidade encontrou</div></div></button>
    <button class="item" data-o="add"><span class="th">➕</span><div><b>Adicionar descoberta</b><div class="mu">Contribua com o mapa</div></div></button>
    <button class="item" data-o="soon"><span class="th">👥</span><div><b>Comunidade</b><div class="mu">Descobertas de outros usuários</div></div></button>
  </div>
</div>
<div id="toast"></div>

<script>
/* =====================================================================
   VICE EARTH v3 — splash ilustrativa desacoplada
   Camadas: 1 CONFIG · 2 DADOS · 3 MAPA BASE · 4 MARCADORES (zoom + cluster) · 5 UI · 6 BOOT
   Para evoluir: troque DataSource (Supabase) e BaseMap (mapa de Leonida);
   a UI e os marcadores não dependem de nenhum dos dois.
   ===================================================================== */

/* ---------- 1. CONFIG ---------- */
const CONFIG={
  cesiumToken:"COLE_SEU_TOKEN_AQUI",           // https://ion.cesium.com
  // poses da tela inicial (visão do espaço): lon/lat = ponto olhado, ângulos em graus.
  // fit = quanto do raio visual da menor dimensão do canvas o planeta ocupa (<1 mostra o planeta inteiro com folga).
  // Em vez de fit, é possível fixar a distância com range (m).
  overview:{
    wide:{lon:-90,lat:16,fit:.70,heading:-18,pitch:-88},   // desktop horizontal
    tall:{lon:-88,lat:14,fit:.72,heading:-14,pitch:-88}    // celular
  },
  intro:{placeId:"vice-city",range:200000,pitch:-38,heading:0,seconds:7.5,uiAt:[.6,.82],markersBelowH:6e6},  // entrada em Leonida
  // aparência do espaço e qualidade por dispositivo (dpr = teto de devicePixelRatio, sse = detalhe do mapa: menor = mais fino)
  look:{
    high:{dpr:2,maxPixels:7e6,msaa:4,hdr:true,sse:10,stars:2200,perFragment:true},
    low:{dpr:1.5,maxPixels:2.4e6,msaa:2,hdr:false,sse:16,stars:1100,perFragment:false},
    atmosphere:{hue:0,saturation:-.1,brightness:-.12,intensity:35},   // halo fino azul/branco
    space:"#010104"
  },
  spin:{degPerSec:.35,resumeMs:3500},          // rotação automática da tela inicial
  levels:[2500000,500000,20000],               // alturas (m) que separam os 4 níveis de zoom
  districtMaxH:120000,                         // bairros só aparecem abaixo disto
  storageKey:"viceearth.v1"
};
Cesium.Ion.defaultAccessToken=CONFIG.cesiumToken;

/* ---------- 2. DADOS ----------
   Esquema igual ao da futura tabela Supabase "places":
   id, name, kind (country|region|city|district|poi|discovery), category (Lugares|Veículos|
   Atividades|Propriedades|Segredos|null), parent (id), lon, lat, h (altura de voo, m),
   d (descrição), e (emoji), g (gradiente), placeholder (bool).
   placeholder:true = conteúdo demonstrativo, posições aproximadas; não é dado oficial. */
const G=(a,b)=>`linear-gradient(135deg,${a},${b})`;
const mk=(id,name,kind,parent,lon,lat,h,d,e,g,category)=>({id,name,kind,parent,lon,lat,h,d,e,g,category:category||null,placeholder:true});
const PLACEHOLDER=[
 mk("leonida","Leonida","country",null,-82.4,27.6,2400000,"Visão geral do estado.","🌴",G("#ff3ec8","#2a0f5a")),
 // regiões
 mk("vice-city","Vice City","region","leonida",-80.19,25.78,150000,"Vida noturna, praias e muito mais.","🌆",G("#ff7a59","#7a2bd6")),
 mk("keys","Leonida Keys","region","leonida",-81.30,24.75,120000,"Ilhas, pontes e paraísos escondidos.","🏝️",G("#27d3ff","#1b6b8a")),
 mk("gellhorn","Port Gellhorn","region","leonida",-85.66,30.16,120000,"Porto, áreas industriais e interior.","⚓",G("#4a6fa5","#1d2b4a")),
 mk("ambrosia","Ambrosia","region","leonida",-80.80,27.00,200000,"Cidades menores e áreas rurais.","🌾",G("#ff9a3c","#7a3b2e")),
 mk("grassrivers","Grassrivers","region","leonida",-80.90,25.90,200000,"Pântanos, vida selvagem e mistérios.","🐊",G("#37a35a","#143d2a")),
 mk("kalaga","Mount Kalaga","region","leonida",-82.40,28.20,200000,"Montanhas, florestas e áreas remotas (posição estimada).","⛰️",G("#6a8caf","#2b3a55")),
 // cidades e bairros (nomes genéricos)
 mk("vc-centro","Vice City — Centro","city","vice-city",-80.19,25.775,25000,"Centro urbano.","🏙️",G("#c9a7ff","#4a1b7a")),
 mk("vc-orla","Orla","district","vice-city",-80.13,25.79,8000,"Faixa litorânea.","🌅",G("#ffb36b","#e0457b")),
 mk("vc-criativo","Distrito criativo","district","vice-city",-80.20,25.80,8000,"Bairro de arte e vida noturna.","🎨",G("#8fd3ff","#3a2a8a")),
 mk("vc-financeiro","Distrito financeiro","district","vice-city",-80.19,25.76,8000,"Torres e escritórios.","🏢",G("#8fd3ff","#1b4a6a")),
 mk("keys-ilha","Ilha principal","city","keys",-81.25,24.72,25000,"Maior ilha da cadeia.","🏝️",G("#27d3ff","#1b6b8a")),
 mk("gh-porto","Porto","city","gellhorn",-85.70,30.18,25000,"Área portuária.","⚓",G("#4a6fa5","#1d2b4a")),
 // pontos de interesse (exemplos)
 mk("ocean-drive","Ocean Drive","poi","vc-orla",-80.1301,25.7826,1000,"Ponto icônico da orla, com hotéis e vida noturna.","📷",G("#ff7a59","#c2338a"),"Lugares"),
 mk("vice-beach","Vice Beach","poi","vc-orla",-80.13,25.80,1200,"Praia movimentada, com areia clara e pôr do sol.","🏖️",G("#ffb36b","#e0457b"),"Lugares"),
 mk("vice-port","Vice Port","poi","vc-centro",-80.17,25.775,1200,"Porto de cruzeiros e cargas.","🚢",G("#4a6fa5","#1d2b4a"),"Lugares"),
 mk("clube","Clube noturno","poi","vc-criativo",-80.14,25.785,900,"Exemplo de atividade enviada pela comunidade.","🎵",G("#7a2bd6","#2a0f5a"),"Atividades"),
 mk("garagem","Garagem Wynwood","poi","vc-criativo",-80.20,25.80,900,"Exemplo de ponto de veículos.","🏎️",G("#7a6bff","#2a2a6a"),"Veículos"),
 mk("cobertura","Cobertura Brickell","poi","vc-financeiro",-80.19,25.76,900,"Exemplo de propriedade no mapa.","🏢",G("#27d3ff","#1b4a6a"),"Propriedades"),
 mk("bunker","Bunker nos Everglades","poi","grassrivers",-80.85,25.75,6000,"Exemplo de segredo (não confirmado).","🔒",G("#37e07a","#0f3b26"),"Segredos")
];

  decorate(v){

/* ---------- 4. MARCADORES: níveis de zoom + clustering ----------
   Nível 0 (longe): Leonida · 1: regiões · 2: cidades e bairros · 3 (rua): pontos e descobertas */
const COR={Lugares:"#ff3ec8",Veículos:"#7a6bff",Atividades:"#ffc233",Propriedades:"#27d3ff",Segredos:"#37e07a",
  country:"#ffffff",region:"#ff3ec8",city:"#c9a7ff",district:"#8fd3ff",poi:"#ff3ec8",discovery:"#ff3ec8"};
const LV=[["country"],["region"],["city","district"],["poi","discovery"]];
const Markers={
  all:[],cat:null,key:null,on:false,
  init(v){
    this.v=v;this.ds={};
    ["top","mid","poi"].forEach(n=>{
      const d=new Cesium.CustomDataSource(n);this.ds[n]=d;v.dataSources.add(d);
      if(n==="top")return;
      d.clustering.enabled=true;d.clustering.pixelRange=n==="poi"?50:40;d.clustering.minimumClusterSize=3;
      d.clustering.clusterEvent.addEventListener((ents,c)=>{
        c.billboard.show=false;c.point.show=true;c.point.pixelSize=28;
        c.point.color=Cesium.Color.fromCssColorString("#1a0d33");c.point.outlineColor=Cesium.Color.fromCssColorString("#ff3ec8");c.point.outlineWidth=2;
        c.point.disableDepthTestDistance=Infinity;
        c.label.show=true;c.label.text=String(ents.length);c.label.font="700 14px Inter,sans-serif";c.label.fillColor=Cesium.Color.WHITE;
        c.label.horizontalOrigin=Cesium.HorizontalOrigin.CENTER;c.label.verticalOrigin=Cesium.VerticalOrigin.CENTER;c.label.disableDepthTestDistance=Infinity;
      });
    });
    v.scene.preRender.addEventListener(()=>this.refresh());
  },
  add(p){
    const big=p.kind==="country",C=Cesium.Color,
      grp=p.kind==="poi"||p.kind==="discovery"?"poi":p.kind==="city"||p.kind==="district"?"mid":"top";
    p.ent=this.ds[grp].entities.add({
      show:false,position:Cesium.Cartesian3.fromDegrees(p.lon,p.lat,60),
      point:{pixelSize:big?6:p.kind==="region"?10:12,color:C.fromCssColorString(COR[p.category]||COR[p.kind]),outlineColor:C.WHITE,outlineWidth:2,disableDepthTestDistance:Infinity},
      label:{text:p.name,font:big?"700 22px Inter,sans-serif":"600 14px Inter,sans-serif",fillColor:C.WHITE,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset:new Cesium.Cartesian2(0,big?-26:-20),disableDepthTestDistance:Infinity}
    });
    p.ent.place=p;this.all.push(p);this.key=null;
  },
  level(h){return h>CONFIG.levels[0]?0:h>CONFIG.levels[1]?1:h>CONFIG.levels[2]?2:3},
  refresh(){
    const h=this.v.camera.positionCartographic.height,L=this.level(h),near=h<CONFIG.districtMaxH,k=L+":"+near+":"+this.cat+":"+this.on;
    if(k===this.key)return;this.key=k;this.L=L;
    this.all.forEach(p=>p.ent.show=this.on&&LV[L].includes(p.kind)&&(p.kind!=="district"||near)&&(L<3||!this.cat||p.category===this.cat));
  },
  fly(p,dur=3,ease,done){
    const hi=p.h>400000,off=hi?0:p.h*1.4/111000;
    this.v.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(p.lon,p.lat-off,p.h),
      orientation:{heading:0,pitch:Cesium.Math.toRadians(hi?-90:-35)},duration:dur,easingFunction:ease,complete:done});
  }
};

/* ---------- 6. BOOT ---------- */
/* ---------- CÂMERA CINEMATOGRÁFICA ----------
   Rotação automática, entrada e retorno. Só conhece a câmera: não depende do mapa, dos dados nem dos marcadores.
   Uma "view" é {lon,lat,range,heading,pitch}: ponto olhado na superfície, distância (m) e ângulos (graus). */
const Cinema={
  spin:{on:false,v:0,hold:false,idleAt:0,last:0},
  init(v){
    this.v=v;this.cam=v.camera;this.spin.last=performance.now();
    this.reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
    v.canvas.addEventListener("pointerdown",()=>{this.spin.hold=true;this.spin.v=0});   // usuário assume o controle
    const up=()=>{if(this.spin.hold){this.spin.hold=false;this.spin.idleAt=performance.now()}};
    addEventListener("pointerup",up);addEventListener("pointercancel",up);
    v.scene.preRender.addEventListener(()=>this.tick());
  },
  tick(){
    const s=this.spin,now=performance.now(),dt=Math.min(.1,(now-s.last)/1000);s.last=now;
    const want=s.on&&!s.hold&&!this.reduced&&now-s.idleAt>CONFIG.spin.resumeMs?CONFIG.spin.degPerSec:0;
    s.v+=(want-s.v)*Math.min(1,dt*(want?.7:8));                 // acelera devagar, freia rápido
    if(Math.abs(s.v)>1e-4)this.cam.rotate(Cesium.Cartesian3.UNIT_Z,-Cesium.Math.toRadians(s.v*dt));
  },
  startSpin(){Object.assign(this.spin,{on:true,hold:false,idleAt:performance.now()-CONFIG.spin.resumeMs+1200})},
  stopSpin(){this.spin.on=false;this.spin.v=0},
  resolve(c){   // aceita {range} direto ou {fit}; calcula a distância para o planeta caber com folga
    if(c.range)return c;
    const cv=this.v.canvas,w=cv.clientWidth||innerWidth,h=cv.clientHeight||innerHeight,R=6371000,
      a=Math.atan(Math.tan(this.cam.frustum.fov/2)*Math.min(w,h)/Math.max(w,h));
    return{...c,range:R/Math.sin(c.fit*a)-R};
  },
  applyView(w){
    this.cam.lookAt(Cesium.Cartesian3.fromDegrees(w.lon,w.lat,0),new Cesium.HeadingPitchRange(Cesium.Math.toRadians(w.heading),Cesium.Math.toRadians(w.pitch),w.range));
    this.cam.lookAtTransform(Cesium.Matrix4.IDENTITY);
  },
  captureView(){   // view atual (útil para ajustar CONFIG.overview: arraste o globo e rode ViceEarth.Cinema.captureView())
    const c=this.cam,ray=new Cesium.Ray(c.positionWC,c.directionWC),hit=Cesium.IntersectionTests.rayEllipsoid(ray,Cesium.Ellipsoid.WGS84);
    if(!hit)return null;
    const pt=Cesium.Ray.getPoint(ray,hit.start),g=Cesium.Cartographic.fromCartesian(pt),
      inv=Cesium.Matrix4.inverse(Cesium.Transforms.eastNorthUpToFixedFrame(pt),new Cesium.Matrix4()),
      o=Cesium.Matrix4.multiplyByPoint(inv,c.positionWC,new Cesium.Cartesian3()),r=Cesium.Cartesian3.magnitude(o);
    return{lon:Cesium.Math.toDegrees(g.longitude),lat:Cesium.Math.toDegrees(g.latitude),range:r,
      heading:Cesium.Math.toDegrees(Math.atan2(-o.x,-o.y)),pitch:Cesium.Math.toDegrees(Math.asin(-o.z/r))};
  },
  /* Voo contínuo da view atual até "to". A distância varia em escala logarítmica (zoom uniforme ao olho) e o
     movimento acelera/desacelera suavemente. Move a câmera de verdade a cada frame. */
  glide(to,sec,onFrame,done){
    const from=this.captureView()||to,t0=performance.now(),wrap=d=>((d+540)%360+360)%360-180,
      dLon=wrap(to.lon-from.lon),dHead=wrap(to.heading-from.heading),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    const off=this.v.scene.preRender.addEventListener(()=>{
      const p=Math.min(1,(performance.now()-t0)/(sec*1000)),e=ease(p);
      this.applyView({lon:from.lon+dLon*e,lat:from.lat+(to.lat-from.lat)*e,range:from.range*Math.pow(to.range/from.range,e),
        heading:from.heading+dHead*e,pitch:from.pitch+(to.pitch-from.pitch)*e});
      if(onFrame)onFrame(p);
      if(p>=1){off();if(done)done()}
    });
  }
};

/* ---------- VISUAL DO ESPAÇO: qualidade, atmosfera e estrelas ----------
   Independe do mapa: só mexe em cena, câmera e renderização. Ajustes em CONFIG.look. */
const Look={
  tier(){   // dispositivo fraco/touch recebe a configuração "low"
    const coarse=matchMedia("(pointer:coarse)").matches,small=Math.min(innerWidth,innerHeight)<700,
      mem=navigator.deviceMemory||4,cores=navigator.hardwareConcurrency||4;
    return coarse||small||mem<4||cores<4?CONFIG.look.low:CONFIG.look.high;
  },
  quality(v){   // nitidez em telas HiDPI com teto de pixels (o Cesium usa 1x por padrão, o que borra)
    const c=v.canvas,css=Math.max(1,c.clientWidth*c.clientHeight);
    const dpr=devicePixelRatio||1,want=Math.max(.75,Math.min(dpr,this.t.dpr,Math.sqrt(this.t.maxPixels/css)));
    v.useBrowserRecommendedResolution=false;
    v.resolutionScale=want/dpr;   // o Cesium já multiplica por devicePixelRatio: aqui vai o fator, não o ratio final
  },
  init(v,t){
    this.v=v;this.t=t;const s=v.scene,A=CONFIG.look.atmosphere,C=Cesium;
    s.backgroundColor=C.Color.fromCssColorString(CONFIG.look.space);
    if(s.skyBox)s.skyBox.show=false;           // o skybox padrão é ampliado demais e fica borrado
    if(s.sun)s.sun.show=false;if(s.moon)s.moon.show=false;   // com skyBox:false o Cesium nem cria Sol e Lua
    try{if(s.context.webgl2)s.msaaSamples=t.msaa;else s.postProcessStages.fxaa.enabled=true}catch(e){}
    try{if(t.hdr){s.highDynamicRange=true;   // o próprio Cesium recusa se o aparelho não suporta
      const tm=C.Tonemapper&&C.Tonemapper.PBR_NEUTRAL;if(s.highDynamicRange&&tm!=null)s.postProcessStages.tonemapper=tm}}catch(e){}   // neutro: preserva as cores
    const a=s.skyAtmosphere;a.show=true;
    try{a.perFragmentAtmosphere=t.perFragment}catch(e){}
    a.hueShift=A.hue;a.saturationShift=A.saturation;a.brightnessShift=A.brightness;a.atmosphereLightIntensity=A.intensity;
    s.light=new C.DirectionalLight({direction:new C.Cartesian3(1,0,0)});
    this.makeStars(v,t.stars);this.quality(v);
    addEventListener("resize",()=>this.quality(v));
    s.preRender.addEventListener(()=>this.tick());
    console.info("[Vice Earth] qualidade",t===CONFIG.look.high?"alta":"econômica",{pixelRatio:+(v.resolutionScale*(devicePixelRatio||1)).toFixed(2),msaa:s.msaaSamples,hdr:s.highDynamicRange});
  },
  makeStars(v,n){   // estrelas nítidas (pontos, sem textura); somem em etapas conforme a câmera se aproxima
    const C=Cesium,heights=[2e6,3.2e6,5e6,8e6],D=2.5e8;let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
    this.cols=heights.map(h=>{const c=new C.PointPrimitiveCollection();v.scene.primitives.add(c);return{c,h}});
    for(let i=0;i<n;i++){
      const z=rnd()*2-1,th=rnd()*6.2832,r=Math.sqrt(1-z*z),k=rnd(),
        size=k>.97?2.4+rnd()*.8:k>.85?1.6+rnd()*.5:1+rnd()*.5,u=rnd(),
        col=u<.2?[.8,.88,1]:u>.85?[1,.93,.82]:[1,1,1],al=(.45+.55*rnd())*(size>1.5?1:.8);
      this.cols[i%4].c.add({position:new C.Cartesian3(r*Math.cos(th)*D,r*Math.sin(th)*D,z*D),pixelSize:size,color:new C.Color(col[0],col[1],col[2],al)});
    }
  },
  tick(){
    const C=Cesium,cam=this.v.camera,h=cam.positionCartographic.height;
    this.cols.forEach(o=>{const on=h>o.h;if(o.c.show!==on)o.c.show=on});
    if(h>2e6){   // luz vinda do alto/direita da câmera: borda iluminada com halo azul/branco discreto
      const s=C.Cartesian3.multiplyByScalar(C.Cartesian3.normalize(cam.positionWC,new C.Cartesian3()),.55,new C.Cartesian3());
      C.Cartesian3.add(s,C.Cartesian3.multiplyByScalar(cam.rightWC,.7,new C.Cartesian3()),s);
      C.Cartesian3.add(s,C.Cartesian3.multiplyByScalar(cam.upWC,.35,new C.Cartesian3()),s);
      C.Cartesian3.negate(C.Cartesian3.normalize(s,s),this.v.scene.light.direction);
    }
  }
};

/* ---------- AMBIENTE ----------
   O Cesium decodifica o mapa em Web Workers. Alguns sandboxes (ex.: prévia do Claude) bloqueiam isso. */
const Env={
  workersOk(){
    try{const u=URL.createObjectURL(new Blob(["self.onmessage=function(){}"],{type:"text/javascript"}));
      const w=new Worker(u);w.terminate();URL.revokeObjectURL(u);return true}catch(e){return false}
  },
  notice(){
    toast("O mapa interativo não roda neste preview. Teste pelo servidor local.");
  }
};
addEventListener("error",e=>{if(/Worker/i.test(e.message||""))Env.notice()});
addEventListener("unhandledrejection",e=>{if(/Worker/i.test(String(e.reason&&e.reason.message||e.reason)))Env.notice()});

/* ---------- 7. SPLASH + MAPA: inicialização sob demanda ----------
   A splash é independente do Cesium. O mapa só é criado quando o usuário entra.
   Isso permite trocar a arte, usar vídeo ou reintroduzir um globo no futuro sem refazer o app. */
let MapRuntime=null, mapBootPromise=null;

async function bootInteractiveMap(){
  if(MapRuntime)return MapRuntime;
  if(mapBootPromise)return mapBootPromise;

  mapBootPromise=(async()=>{
    if(!Env.workersOk())throw new Error("WORKERS_BLOCKED");

    const tier=Look.tier();
    const v=new Cesium.Viewer("globe",{
      globe:false,skyBox:false,useBrowserRecommendedResolution:false,msaaSamples:tier.msaa,
      baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,
      navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false,
      infoBox:false,selectionIndicator:false
    });

    v.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
    try{Look.init(v,tier)}catch(e){console.warn("[Vice Earth] ajustes visuais ignorados:",e)}
    try{await BaseMap.load(v,tier)}catch(e){toast("Verifique seu token do Cesium ion")}
    try{BaseMap.decorate(v)}catch(e){}

    const cam=v.camera,ctl=v.scene.screenSpaceCameraController;
    Cinema.init(v);
    window.ViceEarth={Cinema,Look,CONFIG};

    saved=DataSource.savedIds();
    Markers.init(v);
    (await DataSource.list()).forEach(p=>{byId[p.id]=p;Markers.add(p)});

    // O mapa já nasce na região de exploração: a viagem cinematográfica agora pertence à splash.
    const I=CONFIG.intro,t=byId[I.placeId]||Markers.all.find(p=>p.kind==="region");
    if(t)Cinema.applyView({lon:t.lon,lat:t.lat,range:I.range,heading:I.heading,pitch:I.pitch});
    Markers.on=true;Markers.key=null;Markers.refresh();

    // filtros
    if(!$("#chips").children.length){
      ["Lugares","Veículos","Atividades","Propriedades","Segredos"].forEach(c=>{
        const b=document.createElement("button");b.className="pill";b.textContent=c;
        b.onclick=()=>{
          Markers.cat=Markers.cat===c?null:c;
          [...$("#chips").children].forEach(x=>x.classList.toggle("on",x.textContent===Markers.cat));
          if(Markers.cat&&Markers.level(cam.positionCartographic.height)<3)toast("Aproxime o mapa para ver os pontos");
        };
        $("#chips").appendChild(b);
      });
    }

    // busca
    $("#q").oninput=e=>{
      const t=e.target.value.toLowerCase().trim(),r=$("#res");
      if(!t){r.style.display="none";return}
      list(r,Markers.all.filter(p=>p.name.toLowerCase().includes(t)||(p.category||"").toLowerCase().includes(t)),select);
      r.style.display="block";
    };

    // gaveta
    const openList=(title,arr)=>{$("#dt").textContent=title;list($("#reg"),arr,select);$("#drawer").style.display="block"};
    $("#menu").onclick=()=>openList("Explorar regiões",Markers.all.filter(p=>p.kind==="region"));
    $("#x").onclick=()=>$("#drawer").style.display="none";
    let adding=false;
    document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      const o=b.dataset.o;
      if(o==="saved"){$("#dt").textContent="Salvos";list($("#reg"),Markers.all.filter(p=>saved.has(p.id)),select)}
      else if(o==="add"){adding=true;$("#drawer").style.display="none";toast("Toque no mapa para marcar a descoberta")}
      else toast("Em breve");
    });

    $("#zi").onclick=()=>cam.zoomIn(cam.positionCartographic.height*.4);
    $("#zo").onclick=()=>cam.zoomOut(cam.positionCartographic.height*.6);

    new Cesium.ScreenSpaceEventHandler(v.scene.canvas).setInputAction(m=>{
      if(adding){
        const pos=v.scene.pickPosition(m.position);if(!pos){toast("Toque sobre uma área do mapa");return}
        const c=Cesium.Cartographic.fromCartesian(pos),n=prompt("Nome da descoberta:");adding=false;if(!n)return;
        const p={id:"u"+Date.now(),name:n.slice(0,60),kind:"discovery",category:"Lugares",parent:null,
          lon:Cesium.Math.toDegrees(c.longitude),lat:Cesium.Math.toDegrees(c.latitude),h:900,
          d:"Descoberta adicionada por você (experimental, salva só neste aparelho).",e:"📍",g:G("#ff3ec8","#4a1b7a"),placeholder:false};
        DataSource.add(p);byId[p.id]=p;Markers.add(p);toast("Descoberta adicionada");Markers.fly(p,2);return;
      }
      const k=v.scene.pick(m.position),id=k&&k.id;
      if(Array.isArray(id)){
        const pts=id.map(e=>e.position.getValue(v.clock.currentTime));
        cam.flyToBoundingSphere(Cesium.BoundingSphere.fromPoints(pts),{duration:1.6,offset:new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-40),0)});
      }else if(id&&id.place)select(id.place);
    },Cesium.ScreenSpaceEventType.LEFT_CLICK);

    MapRuntime={v,cam,ctl};
    return MapRuntime;
  })();

  try{return await mapBootPromise}
  catch(e){mapBootPromise=null;throw e}
}

(()=>{
  const app=$("#app"),splash=$("#splash");
  let phase="splash";

  async function enterInteractive(after){
    if(phase!=="splash")return;
    phase="loading";
    $("#go").disabled=true;
    splash.classList.add("transitioning");

    try{
      const R=await bootInteractiveMap();
      R.ctl.enableInputs=false;

      app.style.display="block";
      app.classList.add("t1","t2");
      document.body.classList.add("map-active");

      // Dá um frame para o mapa aparecer atrás da arte antes do crossfade.
      await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      splash.classList.add("out");

      setTimeout(()=>{
        if(phase==="loading"){
          splash.style.display="none";
          phase="app";
          R.ctl.enableInputs=true;
          if(after)after();
        }
      },1100);
    }catch(e){
      console.warn("[Vice Earth] mapa interativo indisponível:",e);
      phase="splash";
      $("#go").disabled=false;
      splash.classList.remove("transitioning","out");
      if(e&&e.message==="WORKERS_BLOCKED")Env.notice();
      else toast("Não foi possível abrir o mapa interativo");
    }
  }

  function returnToSplash(){
    if(phase!=="app")return;
    phase="returning";
    if(MapRuntime)MapRuntime.ctl.enableInputs=false;
    ["#sheet","#drawer","#res"].forEach(s=>$(s).style.display="none");

    splash.style.display="block";
    splash.classList.add("out");
    requestAnimationFrame(()=>{
      document.body.classList.remove("map-active");
      splash.classList.remove("transitioning","out");
    });

    setTimeout(()=>{
      app.style.display="none";
      app.classList.remove("t1","t2");
      $("#go").disabled=false;
      phase="splash";
    },1050);
  }

  $("#go").onclick=()=>enterInteractive();
  $("#s0").onclick=()=>enterInteractive(()=>$("#q").focus());
  $("#back").onclick=returnToSplash;
})();
</script>
</body>
</html>
