<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vice Earth Map Lab — RAW Yanis v16</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.css">
<style>
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#2f6998}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#map{position:fixed;inset:0}
#status{
 position:fixed;z-index:20;left:12px;top:12px;max-width:min(430px,calc(100vw - 24px));
 background:rgba(14,17,23,.92);color:#fff;border:1px solid rgba(255,255,255,.14);
 border-radius:13px;padding:10px 12px;font-size:12px;line-height:1.35
}
#status strong{display:block;font-size:13px;margin-bottom:3px}
#state{opacity:.78}
#home{
 margin-top:8px;border:1px solid rgba(255,255,255,.18);background:#2a2d36;color:#fff;
 border-radius:8px;padding:7px 10px;font-weight:700
}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none!important}
</style>
</head>
<body>
<div id="map"></div>
<div id="status">
 <strong>VICE EARTH MAP LAB · RAW YANIS</strong>
 <div id="state">Iniciando MapLibre…</div>
 <button id="home">Ver mapa inteiro</button>
</div>

<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.mjs';

const state=document.querySelector("#state");
const ROOT="https://raw.githubusercontent.com/rolux/gtadb.org/main/maps/tiles/6/yanis%2C16";
const YANIS_BOUNDS=[[-118,-58],[18,79]];
const NAV_BOUNDS=[[-135,-70],[35,84]];
const PROTO="yanisraw";

state.textContent="MapLibre carregado. Registrando tiles…";

maplibregl.addProtocol(PROTO, async (params, abortController)=>{
  try{
    const u=new URL(params.url);
    const parts=(u.hostname+u.pathname).split("/").filter(Boolean);
    // yanisraw://raw/{z}/{x}/{y}
    const webZ=Number(parts[1]);
    const x=Number(parts[2]);
    const y=Number(parts[3]);
    const gz=webZ-2;

    if(!Number.isFinite(gz) || gz<0 || gz>6){
      throw new Error(`zoom inválido: web ${webZ} → Yanis ${gz}`);
    }

    const url=`${ROOT}/${gz}/${gz}%2C${y}%2C${x}.jpg`;
    const res=await fetch(url,{signal:abortController.signal,cache:"force-cache"});
    if(!res.ok) throw new Error(`HTTP ${res.status}: ${url}`);

    // EXATAMENTE o tipo que o MapLibre aceita no protocolo raster.
    const bmp=await createImageBitmap(await res.blob());
    return {data:bmp};
  }catch(err){
    state.textContent="ERRO DE TILE: "+(err?.message||err);
    console.error(err);
    throw err;
  }
});

const map=new maplibregl.Map({
  container:"map",
  style:{
    version:8,
    sources:{},
    layers:[{id:"background",type:"background",paint:{"background-color":"#2f6998"}}]
  },
  center:[-50,10],
  zoom:2.2,
  bearing:0,
  pitch:0,
  minZoom:2,
  maxZoom:11,
  maxBounds:NAV_BOUNDS,
  renderWorldCopies:false,
  attributionControl:false,
  dragRotate:false,
  pitchWithRotate:false
});

map.touchZoomRotate.disableRotation();

function fitAll(duration=0){
  const mobile=matchMedia("(max-width:899px), (orientation:portrait)").matches;
  map.fitBounds(YANIS_BOUNDS,{
    padding:mobile?{top:90,right:20,bottom:28,left:20}:{top:28,right:28,bottom:28,left:28},
    bearing:0,pitch:0,duration,maxZoom:4.8
  });
  setTimeout(()=>{
    if(map.getZoom()<2.05) map.setZoom(2.05);
  },duration+20);
}

map.on("load",()=>{
  state.textContent="Mapa iniciado. Adicionando Yanis RAW…";

  map.addSource("yanis",{
    type:"raster",
    tileSize:256,
    minzoom:2,
    maxzoom:8,
    tiles:[`${PROTO}://raw/{z}/{x}/{y}`],
    attribution:"GTADB / Yanis v16 · CC BY 4.0"
  });

  map.addLayer({
    id:"yanis",
    type:"raster",
    source:"yanis",
    paint:{
      "raster-opacity":1,
      "raster-fade-duration":0,
      "raster-resampling":"linear"
    }
  });

  fitAll(0);
  state.textContent="Yanis RAW adicionado. Se continuar azul, aguarde 2–3 s ou veja erro aqui.";
});

map.on("idle",()=>{
  if(!state.textContent.startsWith("ERRO")){
    state.textContent=`OK · zoom ${map.getZoom().toFixed(2)} · tiles carregados`;
  }
});

map.on("error",e=>{
  const msg=e?.error?.message||e?.message||"erro desconhecido";
  state.textContent="ERRO MAPA: "+msg;
  console.error(e);
});

document.querySelector("#home").onclick=()=>fitAll(300);
</script>
</body>
</html>
